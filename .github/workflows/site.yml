name: Launch monitor and Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']
permissions:
  contents: write
concurrency:
  group: rocket-launch-monitor
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Refresh full launch snapshot
        env:
          LL2_TOKEN: ${{ secrets.LL2_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/refresh.py
      - name: Save acquisition status and snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public launch schedule'
            git push
          fi
      - name: Acquisition summary
        if: always()
        run: |
          if [ -f data/status.json ]; then
            echo '### Acquisition status' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
